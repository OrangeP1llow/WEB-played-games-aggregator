<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Everything I've played: hours, achievements and trophies from Steam, PS5/PS4, PS3, PS2 and Xbox 360.">
<meta property="og:type" content="website">
<meta property="og:title" content="My Games Stats Preview">
<meta property="og:description" content="Everything I've played: hours, achievements and trophies from Steam, PS5/PS4, PS3, PS2 and Xbox 360.">
<meta property="og:url" content="https://orangep1llow.github.io/WEB-played-games-aggregator/">
<meta property="og:image" content="https://orangep1llow.github.io/WEB-played-games-aggregator/preview.png">
<meta name="twitter:card" content="summary_large_image">
<title>My Games Stats Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef2f7;--mute:#8d9bb0;--gold:#f2b84b;--silver:#b8c2cc;--bronze:#c9824a;--plat:#9fe3ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#080b10;color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
.num{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
/* header totals */
header{display:flex;justify-content:center;gap:clamp(1.5rem,6vw,5rem);padding:1.1rem 1rem;background:#080b10;flex-wrap:wrap}
header div{text-align:center}
header .num{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1}
header span.l{display:block;color:var(--mute);font-size:.85rem;margin-top:.25rem}
/* panels */
main{flex:1;display:flex;flex-direction:column}
.row{flex:1 1 0;display:flex;min-height:340px}
.panel{--tint:#3d7bff66;flex:1 1 0;position:relative;overflow:hidden;cursor:pointer;transition:flex-grow .55s cubic-bezier(.2,.8,.2,1);padding:clamp(1rem,2.5vw,2rem);display:flex;flex-direction:column;background:radial-gradient(ellipse 80% 70% at 90% 0%,var(--tint),transparent 65%),linear-gradient(165deg,#11172a,#080a12)}
.panel.st{--tint:#66c0f433;background:radial-gradient(ellipse 80% 70% at 90% 0%,var(--tint),transparent 65%),linear-gradient(200deg,#16202c,#0a0d13 75%)}
.panel.other{--tint:#f0a63a55}
.panel.ps::before,.panel.other::before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 40px,#ffffff08 40px 80px);filter:blur(18px);animation:wv 14s linear infinite;pointer-events:none}
@keyframes wv{to{transform:translateX(80px)}}
.row.active .panel{flex-grow:.7}
.row .panel.open{flex-grow:3}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.panel h2{margin:0;font-size:clamp(1.8rem,4.5vw,3.4rem);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em}
.panel .sum{color:var(--mute);font-size:.95rem}
.panel.ps .sum,.panel.other .sum{color:#b9c8f5}
.sum b{color:var(--ink);font-weight:600}
/* hidden until the panel is open; fades out fast, fades in after the panel has grown */
.ui{margin-top:1.2rem;opacity:0;transform:translateY(14px);transition:opacity .12s,transform .12s;pointer-events:none;flex:1;min-height:0;overflow:auto}
.panel.open .ui{opacity:1;transform:none;pointer-events:auto;transition:opacity .3s .25s,transform .3s .25s}
.hint{position:absolute;left:clamp(1rem,2.5vw,2rem);bottom:1.2rem;color:var(--mute);font-size:.85rem;transition:opacity .2s}
.panel.open .hint{opacity:0}
/* trophy counts */
.troph{display:flex;gap:1.2rem;margin-top:1.1rem;flex-wrap:wrap}
.troph div{display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.troph .d{width:14px;height:14px;border-radius:50%}
/* "Games N" label */
.cats{display:flex;gap:1.6rem;color:#8f9fd6;font-size:.9rem;margin-bottom:.7rem}
.cats .on{color:#fff;font-weight:600;border-bottom:2px solid #fff;padding-bottom:2px}
/* tabs (Other panel) and sort bar */
.tabs,.sort{display:flex;gap:.4rem;flex-wrap:wrap}
.tabs{margin-bottom:1rem}
.sort{margin-bottom:.8rem}
.tabs button,.sort button{all:unset;cursor:pointer;padding:.3rem .75rem;border-radius:999px;background:#ffffff14;font-size:.8rem;color:#cfd8f5;transition:background .2s}
.tabs button{padding:.4rem .9rem;font-size:.9rem}
.tabs button:hover,.sort button:hover{background:#ffffff2a}
.tabs button[aria-selected=true],.sort button[aria-pressed=true]{background:#fff;color:#0a0d13;font-weight:600}
.tabs span{opacity:.6;margin-left:.25rem}
.tabs button:focus-visible,.sort button:focus-visible,.more:focus-visible{outline:2px solid #fff}
/* cover cards (same for every platform) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.8rem}
.card{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:#2b3342;color:#e8edf7;transition:transform .2s,box-shadow .2s}
.cards .card:hover{transform:translateY(-6px);box-shadow:0 14px 30px #000a,0 0 0 2px #ffffffaa}
.card .cvr{position:relative;overflow:hidden;flex:none;aspect-ratio:3/4;background:linear-gradient(160deg,var(--c),#000b);display:grid;place-items:center;font:800 2rem "Bricolage Grotesque",sans-serif;color:#ffffffd0}
.card .cvr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:.5rem .6rem .6rem;font-size:.8rem;flex:1;display:flex;flex-direction:column}
.card .bd b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.card small{display:block;color:#9aa7bf;margin:.15rem 0 .4rem}
.card .tb{height:4px;border-radius:2px;background:#434c5f;margin-top:auto;overflow:hidden;flex:none}
.card .tb i{display:block;height:100%;background:#5aa84a}
.more{all:unset;cursor:pointer;margin:1rem auto 0;display:block;text-align:center;padding:.5rem 1.2rem;border-radius:999px;background:#ffffff1c}
.more:hover{background:#ffffff33}
.empty{color:var(--mute);padding:.8rem}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:.6rem}
/* desktop: fixed content width so nothing reflows while panels resize */
@media (hover:hover) and (min-width:761px){.ui{width:calc(68vw - 2*clamp(1rem,2.5vw,2rem) - 1.5rem)}}
/* touch devices and narrow screens */
@media (hover:none),(max-width:760px){.hint{position:static;margin-top:.7rem}.panel.open .hint{display:none}}
@media (hover:none){.panel:not(.open) .ui{display:none}.panel::before{animation:none}}
@media (max-width:760px){
header{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.5rem;padding:1rem 1.2rem}
.row{flex-direction:column;flex:none;min-height:0}
.panel{flex-basis:auto;min-height:150px;padding:1.4rem 1.2rem;justify-content:center}
.panel.open{justify-content:flex-start}
.row.active .panel{flex-grow:1}
.row .panel.open{flex-grow:4}
.panel h2{font-size:2.4rem}
.panel .sum{font-size:1.05rem}
.hint{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.panel::before{animation:none}}
/* light theme (follows the device setting) */
@media (prefers-color-scheme:light){
:root{--ink:#161b26;--mute:#5d6878}
body,header{background:#f2f4f9}
.panel{background:radial-gradient(ellipse 80% 70% at 90% 0%,var(--tint),transparent 65%),linear-gradient(165deg,#eef2fc,#dae3f4)}
.panel.st{--tint:#66c0f455;background:radial-gradient(ellipse 80% 70% at 90% 0%,var(--tint),transparent 65%),linear-gradient(200deg,#e9f0f7,#d3dfeb)}
.panel.ps::before,.panel.other::before{background:repeating-linear-gradient(115deg,transparent 0 40px,#00000008 40px 80px)}
.panel .sum,.panel.ps .sum,.panel.other .sum{color:#4c5a76}
.cats{color:#5d6a8c}
.cats .on{color:#161b26;border-bottom-color:#161b26}
.tabs button,.sort button{background:#0000000f;color:#33405c}
.tabs button:hover,.sort button:hover{background:#0000001c}
.tabs button[aria-selected=true],.sort button[aria-pressed=true]{background:#161b26;color:#fff}
.tabs button:focus-visible,.sort button:focus-visible,.more:focus-visible{outline-color:#161b26}
.more{background:#00000012}
.more:hover{background:#0000001f}
.card{background:#fff;color:#161b26;box-shadow:0 1px 3px #0002}
.card small{color:#5d6878}
.card .tb{background:#dfe5ef}
.cards .card:hover{box-shadow:0 14px 30px #0003,0 0 0 2px #00000030}
}
</style>
</head>
<body>
<header>
  <div><span class="num" id="tH">0</span><span class="l">hours (Steam + PS5/PS4)</span></div>
  <div><span class="num" id="tDays">0</span><span class="l">days of playtime</span></div>
  <div><span class="num" id="tA">0</span><span class="l">achievements &amp; trophies</span></div>
  <div><span class="num" id="tG">0</span><span class="l">games</span></div>
</header>
<main>
<div class="row">
  <section class="panel ps" tabindex="0" aria-label="PS5 / PS4">
    <div class="head"><h2>PS5 / PS4</h2><div class="sum" id="psSum"></div></div>
    <div class="ui">
      <div class="shelf" id="shelf"></div>
      <div class="troph" id="troph"></div>
    </div>
    <div class="hint">Hover to open the library</div>
  </section>
  <section class="panel st" tabindex="0" aria-label="Steam">
    <div class="head"><h2>Steam</h2><div class="sum" id="stSum"></div></div>
    <div class="ui">
      <div id="stGrid"></div>
    </div>
    <div class="hint">Hover to open the library</div>
  </section>
  <section class="panel other" tabindex="0" aria-label="Other platforms">
    <div class="head"><h2>Other</h2><div class="sum" id="rtSum"></div></div>
    <div class="ui">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="rt"></div>
    </div>
    <div class="hint">Hover to open the library</div>
  </section>
</div>
</main>
<footer><div id="upd"></div><div class="credit">⚙️ created by Claude &amp; OrangePilllow</div></footer>
<script src="stats.js"></script>
<script src="manual.js"></script>
<script>
/* Data: stats.js (created by fetch.js) and manual.js (your manual lists) */
const S=(window.STATS&&window.STATS.steam)||{games:[]};
const M=window.MANUAL||{};
const st=S.games||[];
const ps=(window.STATS&&window.STATS.psn&&window.STATS.psn.games)||M.ps5||[];
const P=window.STATS&&window.STATS.psn;
const p2=M.ps2||[],xb=M.x360||[],psp=M.psp||[],pcg=M.pc||[];
const have=new Set((M.ps3||[]).map(g=>g.n.toLowerCase()));
const p3=(M.ps3||[]).concat(((P&&P.ps3)||[]).filter(g=>!have.has(g.n.toLowerCase())));
const sum=(a,k)=>a.reduce((s,g)=>s+(g[k]||0),0), $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=["#7a2d2d","#2d5f7a","#6b4a1f","#3b6b3a","#5b3fb0","#8a5a2d"];
const hc=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%6;
const psH=sum(ps,"h"),stH=sum(st,"h"),psA=sum(ps,"a"),stA=sum(st,"a");
const fmt=n=>Math.round(n).toLocaleString("en-US");
const f1=n=>n.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}); // always one decimal, dot separator
const dd=h=>f1(h/24)+" days";
// header = exactly the sum of the two numbers shown in the panels (no rounding drift)
const psHr=Math.round(psH),stHr=Math.round(stH),totH=psHr+stHr;
$("tH").textContent=fmt(totH);
$("tDays").textContent=f1(totH/24);
$("tA").textContent=fmt(psA+stA);
$("tG").textContent=ps.length+st.length+p2.length+p3.length+xb.length+psp.length+pcg.length;
$("psSum").innerHTML=`<b>${ps.length}</b> games · <b>${fmt(psH)} h</b> (${dd(psHr)}) · <b>${fmt(psA)}</b> trophies`;
$("stSum").innerHTML=`<b>${st.length}</b> games · <b>${fmt(stH)} h</b> (${dd(stHr)}) · <b>${fmt(stA)}</b> achievements`;
if(window.STATS&&window.STATS.updated){const d=new Date(window.STATS.updated),p=n=>String(n).padStart(2,"0");$("upd").textContent=`🔄 Updated: ${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`}
/* One shared card for every platform */
const cards=(a,full,limit)=>{
 if(!a.length)return `<div class="empty">Nothing here yet. Add games in manual.js</div>`;
 const list=limit?a.slice(0,limit):a;
 return `<div class="cats"><span class="on">Games</span><span>${a.length}</span></div><div class="cards">`+list.map(g=>{
  const meta=full?[g.h?`${f1(g.h)} h`:"",g.t?`${g.a}/${g.t}`:""].filter(Boolean).join(" · "):"";
  return `<div class="card" title="${esc(g.n)}" style="--c:${g.c||col[hc(g.n)]}"><div class="cvr">${g.img?`<img src="${esc(g.img)}" alt="" loading="lazy">`:`<b>${esc(g.n[0]||"?")}</b>`}</div><div class="bd"><b>${esc(g.n)}</b>${meta?`<small>${meta}</small>`:""}${full&&g.t?`<div class="tb"><i style="width:${g.a/g.t*100}%"></i></div>`:""}</div></div>`}).join("")+`</div>`;
};
/* PS5/PS4 trophy counts */
const T=window.STATS&&window.STATS.psn&&window.STATS.psn.trophies;
$("troph").innerHTML=T?[["plat","Platinum",T.platinum||0],["gold","Gold",T.gold||0],["silver","Silver",T.silver||0],["bronze","Bronze",T.bronze||0]].map(([k,l,v])=>`<div><i class="d" style="background:var(--${k})"></i><b>${v}</b> ${l}</div>`).join(""):"";
/* Sortable lists (Steam and PS5/PS4) */
const pc=g=>g.t?g.a/g.t:-1;
const SORTS={
 recent:["Recently played",(x,y)=>(y.last||0)-(x.last||0)],
 hours:["Most played",(x,y)=>(y.h||0)-(x.h||0)],
 ach:["",(x,y)=>(y.a||0)-(x.a||0)],
 pct:["Completion",(x,y)=>pc(y)-pc(x)||(y.t||0)-(x.t||0)],
 az:["A–Z",(x,y)=>x.n.localeCompare(y.n)]};
function sortable(el,data,kind,limit){
 let key=data.some(g=>g.last)?"recent":"hours",all=false;
 const opts=Object.entries(SORTS).filter(([k])=>k!=="recent"||data.some(g=>g.last));
 const draw=()=>{
  const sorted=data.slice().sort(SORTS[key][1]);
  el.innerHTML=`<div class="sort">`+opts.map(([k,[l]])=>`<button data-k="${k}" aria-pressed="${k===key}">${k==="ach"?"Most "+kind:l}</button>`).join("")+`</div>`+cards(sorted,true,all?0:limit)+(limit&&!all&&sorted.length>limit?`<button class="more" data-more>Show all games</button>`:"");
 };
 el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();if(b.dataset.k){key=b.dataset.k;draw()}else if(b.hasAttribute("data-more")){all=true;draw()}});
 draw();
}
sortable($("stGrid"),st,"achievements",30);
sortable($("shelf"),ps,"trophies",30);
/* Other: one panel, tabs for Xbox 360 / PS3 / PS2 / PSP / PC (biggest list first) */
const RT=[{l:"PS2",a:p2,t:"#f0a63a55"},{l:"PS3",a:p3,t:"#d9467a59"},{l:"Xbox 360",a:xb,t:"#9bd30044"},{l:"PSP",a:psp,t:"#2fc4a055"},{l:"PC",a:pcg,t:"#a06cff55"}].filter(r=>r.a.length).sort((x,y)=>y.a.length-x.a.length);
const rtShow=i=>{const r=RT[i];document.querySelector(".panel.other").style.setProperty("--tint",r.t);$("rt").innerHTML=cards(r.a,false);document.querySelectorAll("#tabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===i))};
$("rtSum").innerHTML=`<b>${p2.length+p3.length+xb.length+psp.length+pcg.length}</b> games`;
$("tabs").innerHTML=RT.map((r,i)=>`<button role="tab" data-i="${i}">${r.l}<span>${r.a.length}</span></button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){e.stopPropagation();rtShow(+b.dataset.i)}});
if(RT.length)rtShow(0);else $("rt").innerHTML=cards([],false);
/* One panel is open at a time. Mouse: hover. Keyboard: focus (Tab). Touch: tap. */
const touch=matchMedia("(hover:none)").matches;
if(touch)document.querySelectorAll(".hint").forEach(h=>h.textContent="Tap to open the library");
const rowEl=document.querySelector(".row"),panels=[...document.querySelectorAll(".panel")];
const setOpen=p=>{panels.forEach(x=>x.classList.toggle("open",x===p));rowEl.classList.toggle("active",!!p)};
let kb=false; // true while the user is navigating with the keyboard
addEventListener("keydown",e=>{if(e.key==="Tab")kb=true});
addEventListener("pointerdown",()=>{kb=false});
addEventListener("mousemove",()=>{kb=false});
panels.forEach(p=>{
 if(!touch){
  p.addEventListener("mouseenter",()=>setOpen(p));
  p.addEventListener("focusin",()=>{if(kb)setOpen(p)});
 }
 p.addEventListener("click",e=>{if(touch&&!e.target.closest(".ui"))setOpen(p.classList.contains("open")?null:p)});
});
rowEl.addEventListener("mouseleave",()=>{if(!touch&&!kb)setOpen(null)});
</script>
</body>
</html>
